# Required for AndroidX dependencies (androidx.core, androidx.appcompat,
# com.google.android.material, ...) used by app/build.gradle. Without this,
# the build fails at :app:checkDebugAarMetadata on any machine, fresh clone
# or not - this is a project-wide setting, not machine-specific, so unlike
# local.properties it belongs in git.
android.useAndroidX=true
android.enableJetifier=false

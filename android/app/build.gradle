plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release builds are signed with a dedicated release key when the CI secrets
// are present (see .github/workflows/release.yml) so every published APK
// shares one signing identity and can be installed as an upgrade over the
// last one. Locally, or whenever those secrets aren't set, release builds
// fall back to the auto-generated debug key so `./gradlew assembleRelease`
// still works out of the box for contributors with no extra setup.
def releaseKeystorePath = System.getenv("RELEASE_KEYSTORE_PATH")
def hasReleaseSigning = releaseKeystorePath != null && !releaseKeystorePath.isEmpty() && file(releaseKeystorePath).exists()

android {
    namespace 'com.dash.phonecon'
    compileSdk 34

    defaultConfig {
        applicationId "com.dash.phonecon"
        minSdk 26
        targetSdk 34
        versionCode 10200
        versionName "1.2.0"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
}
